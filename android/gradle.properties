# React Native / Expo Android Configuration
# Created by Expo CLI - Required for React Native 0.86 with Kotlin 2.1.20

# Hermes is enabled for better performance
hermesEnabled=true

# Build performance and memory settings
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# JVM target for Kotlin compilation
kotlin.jvm.target.validation.mode=warning

# Enable Gradle's build cache
org.gradle.buildcache.enabled=true

# Java home — configured per-environment. Do NOT hardcode a local path here,
# it will break every other machine/CI. Instead, let Gradle pick up the system
# JDK (recommended) or override at build time with:
#   ORG_GRADLE_PROJECT_java.home=/path/to/jdk17

# AndroidX package structure
android.useAndroidX=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true
