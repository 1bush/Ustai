pluginManagement {
  def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
  
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "-e", "const cwd = process.cwd(); process.chdir('" + projectRoot.replace('\\', '\\\\') + "'); const p = require.resolve('@react-native/gradle-plugin/package.json', { paths: [process.cwd()] }); process.chdir(cwd); console.log(p)")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "-e", "const cwd = process.cwd(); process.chdir('" + projectRoot.replace('\\', '\\\\') + "'); const p = require.resolve('expo-modules-autolinking/package.json', { paths: [process.cwd()] }); process.chdir(cwd); console.log(p)")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Ustai Im'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)

// Fix for expo-modules-core compilation issues — buildConfig=false moved to
// build.gradle where subprojects{} is valid (not available in settings context).
// Create a fallback libs.versions.toml if missing (for RN 0.86.2 compatibility)
def tomlFile = file("${rootDir}/node_modules/react-native/gradle/libs.versions.toml")
if (!tomlFile.exists()) {
    logger.info("Creating fallback libs.versions.toml for React Native")
    tomlFile.parentFile.mkdirs()
    tomlFile.text = """
[versions]
react-native = "0.86.2"

[libraries]
react-native-android = { module = "com.facebook.react:react-android", version.ref = "react-native" }
react-native-hermes = { module = "com.facebook.react:hermes-android", version.ref = "react-native" }
"""
}
