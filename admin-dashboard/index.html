<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<title>USTAI — Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; margin: 0; background: #000000; color: #ffffff; }
  header { background: #141414; color: #FF7A1A; padding: 18px 30px; border-bottom: 2px solid #FF7A1A; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  header button { background: transparent; border: 1px solid #FF7A1A; color: #FF7A1A; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .login-box { max-width: 360px; margin: 100px auto; padding: 30px; background: #141414; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.5); border: 1px solid #2A2A2A; }
  .login-box h2 { color: #FF7A1A; }
  .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #2A2A2A; border-radius: 8px; box-sizing: border-box; background: #000; color: #fff; }
  .login-box button, .toolbar button, .form-inline button { background: #FF7A1A; color: #000; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
  main { display: flex; max-width: 1400px; margin: 0 auto; }
  nav.tabs { width: 200px; flex-shrink: 0; padding: 20px 10px; border-right: 1px solid #2A2A2A; min-height: calc(100vh - 60px); }
  nav.tabs button { display: block; width: 100%; text-align: left; background: transparent; border: none; color: #B3B3B3; padding: 12px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 4px; }
  nav.tabs button.aktiv { background: #1c1400; color: #FF7A1A; font-weight: 700; }
  nav.tabs button:hover { background: #141414; }
  .permbajtja { flex: 1; padding: 24px; }
  .faqe { display: none; }
  .faqe.aktive { display: block; }
  .kartat { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
  .karta { background: #141414; padding: 20px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.4); border: 1px solid #2A2A2A; }
  .karta .vlera { font-size: 26px; font-weight: 800; color: #FF7A1A; }
  .karta .etiketa { color: #b3b3b3; font-size: 13px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: #141414; border-radius: 12px; overflow: hidden; border: 1px solid #2A2A2A; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #2A2A2A; font-size: 13px; color: #eaeaea; vertical-align: top; }
  th { background: #1c1c1c; color: #FF7A1A; }
  tr:hover td { background: #1a1a1a; }
  a { color: #FF7A1A; }
  .badge-pritje { background: #FFB020; color: #000; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
  .badge-ok { background: #FF7A1A; color: #000; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
  .badge-ban { background: #E5484D; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
  .form-inline { display: flex; gap: 8px; margin-bottom: 16px; }
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <h2>Admin Login</h2>
  <input id="emailInput" placeholder="Përdoruesi (Bush)" type="text" />
  <input id="passInput" placeholder="Fjalëkalimi (BUSH1)" type="password" />
  <button onclick="hyrAdmin()">Hyr</button>
  <p id="loginError" style="color:red;font-size:13px;"></p>
</div>

<div id="dashboardView" style="display:none;">
  <header>
    <h1>USTAI IM — Paneli Admin</h1>
    <button onclick="dilAdmin()">Dil</button>
  </header>
  <main>
    <nav class="tabs" id="tabet">
      <button class="aktiv" data-faqe="permbledhje" onclick="shkoTekFaqja(this)">📊 Përmbledhje</button>
      <button data-faqe="konfliktet" onclick="shkoTekFaqja(this)">⚠️ Konfliktet</button>
      <button data-faqe="verifikimet" onclick="shkoTekFaqja(this)">✅ Verifikimet</button>
      <button data-faqe="administrimi" onclick="shkoTekFaqja(this)">⚙️ Administrimi</button>
    </nav>
    <div class="permbajtja">
      <div class="faqe aktive" id="faqja-permbledhje">
        <div class="kartat" id="kartatPermbledhje"></div>
        <h2>Përdorues të bllokuar</h2>
        <table id="tabelaBllokuar"><thead><tr><th>Emri</th><th>Telefon</th><th>Arsyeja</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="faqe" id="faqja-konfliktet">
        <h2>Raportimet e konflikteve</h2>
        <table id="tabelaKonfliktet"><thead><tr><th>Data</th><th>Puna</th><th>Raportuesi</th><th>Statusi</th><th>Veprim</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="faqe" id="faqja-verifikimet">
        <h2>Dokumente në pritje</h2>
        <table id="tabelaVerifikime"><thead><tr><th>Ustai</th><th>Dokumenti</th><th>Veprim</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="faqe" id="faqja-administrimi">
        <h2>Kategoritë</h2>
        <div class="form-inline">
          <input id="kName" placeholder="Emri" />
          <input id="kIcon" placeholder="Ikona" style="width:70px"/>
          <button onclick="shtoK()">Shto</button>
        </div>
        <table id="tabelaKategorite"><thead><tr><th>Ikonë</th><th>Emri</th><th>Veprim</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
  </main>
</div>

<script>
  const pb = new PocketBase("http://127.0.0.1:8090");

  function hyrAdmin() {
    const user = document.getElementById('emailInput').value;
    const pass = document.getElementById('passInput').value;
    if (user === "Bush" && pass === "BUSH1") {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      ngarko();
    } else {
      document.getElementById('loginError').innerText = "Gabim!";
    }
  }

  function dilAdmin() { location.reload(); }

  function shkoTekFaqja(btn) {
    document.querySelectorAll('.faqe').forEach(f => f.classList.remove('aktive'));
    const faqeId = 'faqja-' + btn.getAttribute('data-faqe');
    document.getElementById(faqeId).classList.add('aktive');
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('aktiv'));
    btn.classList.add('aktiv');
  }

  async function ngarko() {
    try {
      const bllokuar = await pb.collection('profiles').getFullList({ filter: 'eshte_i_bllokuar=true' });
      document.getElementById('kartatPermbledhje').innerHTML = `<div class="karta"><div class="vlera">${bllokuar.length}</div><div class="etiketa">Të bllokuar</div></div>`;
      document.querySelector('#tabelaBllokuar tbody').innerHTML = bllokuar.map(u => `<tr><td>${u.emri}</td><td>${u.telefon}</td><td>${u.arsyeja_bllokimit || '-'}</td></tr>`).join('');

      const kats = await pb.collection('categories').getFullList({ sort: 'emri' });
      document.querySelector('#tabelaKategorite tbody').innerHTML = kats.map(k => `<tr><td>${k.ikona}</td><td>${k.emri}</td><td><button onclick="fshijK('${k.id}')">Fshij</button></td></tr>`).join('');

      const vdocs = await pb.collection('verification_documents').getFullList({ filter: 'status="ne_pritje"', expand: 'ustai_id' });
      document.querySelector('#tabelaVerifikime tbody').innerHTML = vdocs.map(v => `<tr><td>${v.expand?.ustai_id?.emri || 'Ustai'}</td><td><a href="${pb.files.getUrl(v, v.dokumenti_url)}" target="_blank">Hap</a></td><td><button onclick="aprovoV('${v.id}','${v.ustai_id}')">Aprovo</button></td></tr>`).join('');

      const reps = await pb.collection('reports').getFullList({ sort: '-created', expand: 'reporter_id' });
      document.querySelector('#tabelaKonfliktet tbody').innerHTML = reps.map(r => `<tr><td>${new Date(r.created).toLocaleDateString()}</td><td>Puna #${r.job_id}</td><td>${r.expand?.reporter_id?.emri || 'User'}</td><td><span class="badge-pritje">${r.status}</span></td><td><button onclick="zgjidhR('${r.id}')">Mbyll</button></td></tr>`).join('');
    } catch(e) {
        console.error("Gabim gjatë ngarkimit:", e);
    }
  }

  async function shtoK() {
    const emri = document.getElementById('kName').value;
    const ikona = document.getElementById('kIcon').value;
    if(emri) {
        try {
            await pb.collection('categories').create({ emri, ikona });
            ngarko();
            document.getElementById('kName').value = "";
            document.getElementById('kIcon').value = "";
        } catch(e) { alert("Gabim!"); }
    }
  }

  async function fshijK(id) {
      if(confirm("Fshij?")) {
          try {
              await pb.collection('categories').delete(id);
              ngarko();
          } catch(e) { alert("Gabim!"); }
      }
  }

  async function aprovoV(id, uid) {
      try {
          await pb.collection('verification_documents').update(id, { status: 'aprovuar' });
          await pb.collection('profiles').update(uid, { eshte_i_verifikuar: true });
          ngarko();
      } catch(e) { alert("Gabim!"); }
  }

  async function zgjidhR(id) {
      try {
          await pb.collection('reports').update(id, { status: 'zgjidhur' });
          ngarko();
      } catch(e) { alert("Gabim!"); }
  }
</script>
</body>
</html>
