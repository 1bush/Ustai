# ==========================================================
#  USTAI — Render Blueprint
#  Deploy ne Render: Dashboard -> New -> Blueprint -> lidh repo
#  (ose CLI:  render blueprint launch  /  render.yaml ne root)
# ==========================================================

services:
  # ---------------------------------------------------------------
  # Paneli Admin — faqe statike (admin-dashboard/index.html)
  # Render runtime: static  -> sherben direkt repo pa build
  # ---------------------------------------------------------------
  - type: web
    name: ustai-admin
    runtime: static
    staticPublishPath: ./admin-dashboard

    # Deploy automatik kur ndryshon dega main
    # NOTE: Render-i e kerkon ose autoDeploy ose autoDeployTrigger, jo te dyja me sakte.
    # autoDeployTrigger: commit == autoDeploy: true (deploy pas çdo commit-it ne dega).
    autoDeployTrigger: commit
    branch: main

    # Mos krijo preview per Pull Request (te ruajtur me API te re)
    previews:
      generation: "off"

    # Faqe statike -> cdo rrugë shërbehet nga index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
